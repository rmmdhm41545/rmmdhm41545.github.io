<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MJ 排行榜</title>
    <style>
        :root {
            --bg: #0b0b18; --text: #f0f0f5; --text-secondary: #b8b8d0;
            --accent: #7c3aed; --accent2: #ec4899;
            --card-bg: rgba(255, 255, 255, 0.045); --card-border: rgba(255, 255, 255, 0.16);
            --shadow: 0 20px 60px rgba(0, 0, 0, 0.55);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg); color: var(--text); min-height: 100vh;
            display: flex; flex-direction: column; align-items: center; padding: 20px; overflow-x: hidden;
        }
        .lb-container {
            width: 100%; max-width: 480px; background: var(--card-bg); border: 1px solid var(--card-border);
            border-radius: 24px; padding: 24px; backdrop-filter: blur(32px) saturate(1.5); -webkit-backdrop-filter: blur(32px) saturate(1.5);
            box-shadow: var(--shadow); margin-top: 40px;
        }
        .lb-title {
            font-size: 1.8rem; font-weight: 900; text-align: center; margin-bottom: 20px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .lb-list { display: flex; flex-direction: column; gap: 8px; }
        .lb-item {
            display: flex; align-items: center; padding: 12px 16px; border-radius: 16px;
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
            animation: fadeInUp 0.5s ease both;
        }
        .lb-item.top-1 { background: linear-gradient(135deg, rgba(255, 215, 0, 0.2), transparent); border-color: rgba(255, 215, 0, 0.4); }
        .lb-item.top-2 { background: linear-gradient(135deg, rgba(192, 192, 192, 0.2), transparent); border-color: rgba(192, 192, 192, 0.4); }
        .lb-item.top-3 { background: linear-gradient(135deg, rgba(205, 127, 50, 0.2), transparent); border-color: rgba(205, 127, 50, 0.4); }
        .lb-rank { font-size: 1.2rem; font-weight: 900; width: 40px; text-align: center; color: var(--accent); }
        .lb-name { font-weight: 800; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .lb-score { font-size: 1.4rem; font-weight: 900; margin-right: 16px; }
        .lb-detail { font-size: 0.75rem; color: var(--text-secondary); text-align: right; line-height: 1.4; }
        .btn-back {
            margin-top: 24px; width: 100%; padding: 14px; font-size: 1rem; font-weight: 800;
            border: none; border-radius: 16px; cursor: pointer; color: #fff;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            box-shadow: 0 6px 20px rgba(124, 58, 237, 0.4); transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .btn-back:hover { transform: translateY(-3px) scale(1.02); }
        .btn-back:active { transform: scale(0.95); }
        .loading { text-align: center; color: var(--text-secondary); padding: 40px 0; font-weight: 600; }
        .error-msg { text-align: center; color: #ff3355; padding: 20px 0; font-weight: 600; font-size: 0.9rem; word-break: break-all; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="lb-container">
        <div class="lb-title">🏆 在线排行榜</div>
        <div class="lb-list" id="lbList"><div class="loading">数据加载中...</div></div>
        <button class="btn-back" onclick="window.location.href='../'">← 返回游戏</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // ⚠️ 注意：务必替换成你自己的 Supabase 配置
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
        
        let supabase = null;
        const listEl = document.getElementById('lbList');

        // 加载超时保护：8秒后如果还没加载出来，直接报错
        const timeoutId = setTimeout(() => {
            if (listEl.innerHTML.includes('加载中')) {
                listEl.innerHTML = '<div class="error-msg">⏰ 加载超时，请检查网络或配置<br>（多半是 SUPABASE_URL 没改，或者 RLS 策略拦截）</div>';
            }
        }, 8000);

        async function loadLeaderboard() {
            try {
                // 1. 检查配置是否替换
                if (SUPABASE_URL.includes('YOUR_') || SUPABASE_ANON_KEY.includes('YOUR_')) {
                    clearTimeout(timeoutId);
                    listEl.innerHTML = '<div class="error-msg">❌ 请先在代码里替换 SUPABASE_URL 和 SUPABASE_ANON_KEY！</div>';
                    return;
                }

                // 2. 初始化 Supabase
                supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

                // 3. 发起请求
                const { data, error } = await supabase
                    .from('scores')
                    .select('*')
                    .order('score', { ascending: false })
                    .order('max_combo', { ascending: false })
                    .limit(50);

                clearTimeout(timeoutId);

                if (error) {
                    throw error; // 把 Supabase 的具体错误抛出来
                }

                if (!data || data.length === 0) {
                    listEl.innerHTML = '<div class="loading">暂无记录，快来抢第一！</div>';
                    return;
                }

                // 4. 渲染列表
                const medals = ['🥇', '🥈', '🥉'];
                listEl.innerHTML = data.map((item, i) => {
                    const rankClass = i < 3 ? ` top-${i + 1}` : '';
                    const rankText = i < 3 ? medals[i] : (i + 1);
                    const name = escapeHtml(item.name || '匿名玩家');
                    const date = item.created_at ? new Date(item.created_at).toLocaleDateString('zh-CN', { month: '2-digit', day: '2-digit' }) : '';
                    return `<div class="lb-item${rankClass}" style="animation-delay: ${i * 0.05}s">
                        <span class="lb-rank">${rankText}</span>
                        <span class="lb-name">${name}</span>
                        <span class="lb-score">${item.score}</span>
                        <span class="lb-detail">连击 ${item.max_combo}<br>${date}</span>
                    </div>`;
                }).join('');

            } catch (e) {
                clearTimeout(timeoutId);
                console.error(e);
                // 直接显示真实错误，方便排查
                listEl.innerHTML = `<div class="error-msg">❌ 加载失败：<br>${e.message || '未知错误'}<br><br>请检查：<br>1. Supabase URL和Key是否配置正确<br>2. scores 表是否已创建<br>3. RLS 策略是否放行</div>`;
            }
        }

        function escapeHtml(str) {
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        loadLeaderboard();
    </script>
</body>
