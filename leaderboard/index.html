<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MJ 排行榜</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'PingFang SC', sans-serif;
            background: #0b0b18;
            color: #f0f0f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .lb-container {
            width: 100%;
            max-width: 480px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 24px;
            margin-top: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        .lb-title {
            font-size: 1.6rem;
            font-weight: 900;
            text-align: center;
            margin-bottom: 20px;
            color: #a78bfa;
        }
        .lb-list { display: flex; flex-direction: column; gap: 8px; }
        .lb-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .lb-item.top-1 { background: rgba(255, 215, 0, 0.15); border-color: rgba(255, 215, 0, 0.3); }
        .lb-item.top-2 { background: rgba(192, 192, 192, 0.15); border-color: rgba(192, 192, 192, 0.3); }
        .lb-item.top-3 { background: rgba(205, 127, 50, 0.15); border-color: rgba(205, 127, 50, 0.3); }
        .lb-rank { width: 36px; font-weight: 900; font-size: 1.1rem; color: #a78bfa; }
        .lb-name { flex: 1; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .lb-score { font-size: 1.3rem; font-weight: 900; margin-right: 12px; }
        .lb-detail { font-size: 0.75rem; color: #b8b8d0; text-align: right; }
        .btn-back {
            margin-top: 24px; width: 100%; padding: 14px; font-size: 1rem; font-weight: 800;
            border: none; border-radius: 12px; cursor: pointer; color: #fff;
            background: linear-gradient(135deg, #7c3aed, #ec4899);
            transition: 0.2s;
        }
        .btn-back:active { transform: scale(0.95); }
        .status-msg { text-align: center; padding: 40px 0; font-weight: 600; color: #b8b8d0; }
        .error-msg { text-align: center; padding: 40px 0; font-weight: 600; color: #ff3355; word-break: break-all; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="lb-container">
        <div class="lb-title">🏆 在线排行榜</div>
        <div class="lb-list" id="lbList"><div class="status-msg">数据加载中...</div></div>
        <button class="btn-back" onclick="window.location.href='../'">← 返回游戏</button>
    </div>

    <script>
        // 你的 Supabase 配置（直接写死，不用外部库）
        const SUPABASE_URL = 'https://bignhwmpjnplzksokzif.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJpZ25od21wam5wbHprc29remlmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk4MTI1NTAsImV4cCI6MjEwNTM4ODU1MH0.FlZRCL5FlT3X1AVIKt02CLoK8CqF8Lja8YAk1f2reL4';
        
        const listEl = document.getElementById('lbList');

        async function loadLeaderboard() {
            try {
                // 直接用 fetch 请求 Supabase 的 REST API，不走任何外部 JS
                const response = await fetch(`${SUPABASE_URL}/rest/v1/scores?select=*&order=score.desc&limit=50`, {
                    method: 'GET',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                    }
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();

                if (!data || data.length === 0) {
                    listEl.innerHTML = '<div class="status-msg">暂无记录，快来抢第一！</div>';
                    return;
                }

                const medals = ['🥇', '🥈', '🥉'];
                listEl.innerHTML = data.map((item, i) => {
                    const rankClass = i < 3 ? ` top-${i + 1}` : '';
                    const rankText = i < 3 ? medals[i] : (i + 1);
                    const name = (item.name || '匿名玩家').replace(/</g, '&lt;');
                    return `<div class="lb-item${rankClass}">
                        <span class="lb-rank">${rankText}</span>
                        <span class="lb-name">${name}</span>
                        <span class="lb-score">${item.score}</span>
                        <span class="lb-detail">连击 ${item.max_combo}</span>
                    </div>`;
                }).join('');

            } catch (error) {
                console.error(error);
                listEl.innerHTML = `<div class="error-msg">❌ 加载失败<br>${error.message}<br><br>请检查网络或 Supabase 状态</div>`;
            }
        }

        loadLeaderboard();
    </script>
</body>
</html>
